<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打包清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>打包清单</h1>
      <p id="summary" class="summary">载入中…</p>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </header>

    <section class="add-row">
      <input id="add-input" type="text" placeholder="添加物品…" autocomplete="off" maxlength="60">
      <button id="add-btn" type="button">添加</button>
    </section>

    <ul id="item-list" class="item-list"></ul>
    <p id="empty-hint" class="empty-hint hidden">清单是空的，添加第一件物品吧</p>

    <section class="footer-row">
      <button id="reset-btn" type="button" class="ghost-btn">全部重置为待打包</button>
    </section>

    <section id="token-box" class="token-box">
      <label>
        scoped token（纯浏览器调试用，App 内可留空）：
        <input id="token-input" type="password" placeholder="p1.xxx.yyy" autocomplete="off">
      </label>
      <button id="token-save" type="button">保存 token</button>
    </section>
    <pre id="log" class="log"></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
