<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链路测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>链路测试</h1>
    <p id="banner" class="banner">插件链路通了</p>
    <section>
      <button id="inc-btn" type="button">点我 +1</button>
      <span id="counter-view">—</span>
    </section>
    <section id="token-box">
      <label>
        scoped token（纯浏览器调试用，App 内可留空）：
        <input id="token-input" type="password" placeholder="p1.xxx.yyy" autocomplete="off">
      </label>
      <button id="token-save" type="button">保存 token</button>
    </section>
    <pre id="log"></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
