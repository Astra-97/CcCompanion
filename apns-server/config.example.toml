# CcCompanion APNs server 配置模板
# 实际部署 cp config.example.toml config.toml 然后填入真实值
# config.toml 不入 git (已在 .gitignore)

[apns]
# Apple Developer 后台拿
# .p8 文件下载到本机后路径绝对化
p8_path = "~/CcCompanion/apns-server/secrets/AuthKey_XXXXXXXXXX.p8"

# Apple Developer 后台 -> Membership 看 Team ID (10 位字符)
team_id = "XXXXXXXXXX"

# .p8 文件名里的 10 位字符 / 也在 Apple Developer 后台 Keys 页能看
key_id = "XXXXXXXXXX"

# 主 app Bundle ID (跟 Xcode 项目 Bundle Identifier 一致)
# 改成你自己的 bundle id 例 com.yourname.cccompanion
bundle_id = "com.example.cccompanion"

# 沙盒 vs 生产
# Xcode debug build (run from Xcode) 走 sandbox = true
# TestFlight / App Store build 走 sandbox = false
# 真机测试常规走 sandbox 拿 device + Live Activity push token 时 token 是 sandbox-only
sandbox = true

[server]
# 监听地址 默认 127.0.0.1 (内网 only)
# 跨设备访问改 0.0.0.0 + 配 shared_secret 或者用 Tailscale / ZeroTier
host = "127.0.0.1"
port = 8795

# token 持久化路径 (重启后 reload 不丢)
token_store_path = "~/CcCompanion/apns-server/tokens/active.json"

# P0-3: 写接口鉴权 token. 留空则启动时自动生成并写 ~/.ots/secret (mode 0600)。
# 自动生成的 secret 会 log 到控制台，复制到 OTS app onboarding wizard。
# 手动填写可覆盖自动生成。不要 commit 真实密钥到 git。
shared_secret = ""

# P0-1: strict_auth=true 所有写接口必须带 X-Auth-Token 头。
# 默认 true (secure-by-default)。调试时可改 false，上线前改回 true。
strict_auth = true

# P0-1: 允许绑定 0.0.0.0 (公网接口)。默认 false = 仅本机。
# 如果改 true，请确保前置 HTTPS reverse proxy (Caddy/Nginx) + 防火墙已配置。
allow_public_bind = false

# P0-2: 开启远程控制端点 (/chain/abort /chain/restart /chat/regenerate /tmux/send /tmux/capture)。
# 默认 false。只有在同机器跑 Claude Code 且理解风险时才改 true。
# CcCompanion 阉割版用户不需要改此项。
allow_remote_control = false

# IP 访问白名单. 空列表=不限制.
# 可选值例: ["127.0.0.1", "10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"]
allowed_ips = []

# default_session sets the tmux session name CcCompanion connects to.
# Change this to match your own tmux session name.
# default_session = "cc"

# Kairos Codex shared active session state. App Kairos private chat reads this
# shared pointer from the Telegram bot state first, then falls back to the
# legacy per-user active session below.
# codex_bot_state_path = "/root/Windows-Codex-TG/.runtime/bot_state.json"
# codex_user_id = "8715009653"
# codex_shared_session_name = "kairos"
# codex_bin = "/usr/bin/codex"
# codex_home = "/root/.codex"
# codex_model = "gpt-5.5"
# codex_reasoning_effort = "high"
# `app-server` keeps one Codex app-server child and resumes the same thread.
# Set `legacy-exec` only as a temporary rollback switch.
# codex_kairos_backend = "app-server"
# Fallback is disabled by default because a transport failure after turn/start
# may have already performed tools. The bridge only marks pre-start failures as safe.
# codex_app_server_fallback_to_exec = false
# Kairos App turns auto-forge after the completed reply has been persisted.
# The old session is claimed at most once across service restarts.
# codex_auto_forge_enabled = true
# codex_auto_forge_threshold_percent = 80
# codex_auto_forge_retain_messages = 80
# Optional app-server config override. It is intentionally unset by default.
# Codex 0.144 clamps oversized model_auto_compact_token_limit values to roughly
# 90% of the model context window, so this cannot disable compaction. The 80%
# post-turn auto forge above is the primary protection; thread/compacted also
# forces a forge when Codex compacts first.
# codex_app_server_model_auto_compact_token_limit = 1000000

# CC Companion channel transport for /chat/send.
# 默认关闭。开启后，普通 xiaoke 联系人的 /chat/send 会先 POST 到
# {channel_transport_url}/messages；成功则不再注入 tmux，失败按
# channel_transport_fallback_to_tmux 决定是否回退旧 tmux 注入路径。
# kairos / apples 等特殊联系人不走这个开关。
#
# 安全提示：不要把 8810 裸露到公网。推荐只监听 127.0.0.1，或放在有认证、
# HTTPS、访问控制的内网/reverse proxy 后面。
#
# 使用前需要先独立启动 channel test session / POC 服务，并确保它能处理：
# POST /messages
# Header: X-Auth-Token: COMPANION_CHANNEL_TOKEN
# Body: {message_id, contact_id, text, quoted_ts?, metadata?}
channel_transport_enabled = false
channel_transport_url = "http://127.0.0.1:8810"
channel_transport_token = ""

# 命中的 contact 才会尝试 channel transport。默认只允许 xiaoke。
# 空列表 [] 表示不允许任何 contact，即使 channel_transport_enabled=true 也不会路由。
channel_transport_contacts = ["xiaoke"]

# true: channel 请求失败时自动 fallback 到原 tmux 注入。
# false: channel 请求失败时直接返回 502，并保留已写入的 user history record。
channel_transport_fallback_to_tmux = true
channel_transport_timeout_seconds = 5

# 夏以昼（ai-custom）的 Claude transport 与上面的“小克 channel”完全隔离。
# 它不是本 TOML 的远程设置项，而是 operator-only 的
# state/ai_relay_config.json 字段；默认继续使用可回滚的 -p relay：
#
#   "claude_transport": "relay",          # relay | channel
#   "claude_channel_url": "http://127.0.0.1:8821",
#   "claude_channel_token_file": "/var/lib/cc-xia-relay/channel-state/channel.token",
#   "claude_channel_timeout_seconds": 900
#
# 只有专用 cc-xia-claude-channel service 通过 loopback/auth/session smoke
# 后才可在 idle 状态切成 channel。不要复用 8810、小克的 cctg、root HOME、
# /root/.claude 或 /root/.ccbot。回滚只把该字段改回 relay；历史不迁移不删除。

# 小克·工具版 (tool-version dispatcher) — 规则驱动的定时调度器（不含 AI）。
# 在排定时间把固定的 trigger 文本，走和 /chat/send 完全一样的通道注入主 session
# （channel transport，失败回退 tmux），并写进 chat history 让用户可见。主 session
# 收到 trigger 后用自己的上下文/记忆生成真正的回复（例如早安问候）。调度本身不调用 LLM。
#
# tool_dispatcher_enabled: 总开关，默认 true。
# tool_dispatcher_schedule_path: 排程文件路径，默认 <token_store 同目录>/tool_dispatcher.json。
# tool_dispatcher_seed_default: 文件不存在时是否写入内置默认排程（早安/日记等），默认 true。
# tool_dispatcher_tick_seconds: 轮询间隔秒数，默认 20。
#
# 排程文件为 JSON，每条 rule 字段：
#   id / enabled / time("HH:MM") / tz(IANA 时区) / weekdays([0=周一..6=周日], 空=每天)
#   contact_id(默认 xiaoke) / text(trigger 文本) / catch_up_grace_minutes(错过补发宽限分钟)
# 规则按本地日期去重（last_fired），重启不会重复触发也不会漏发已服务的时段。
tool_dispatcher_enabled = true
# tool_dispatcher_schedule_path = "~/CcCompanion/apns-server/tokens/tool_dispatcher.json"
tool_dispatcher_seed_default = true
tool_dispatcher_tick_seconds = 20

[link_preview]
# 一期服务端链接预览：纯 HTTP 抓 OG/正文并把全文写进 attachments；不启动浏览器。
enabled = true
total_timeout_seconds = 15
max_urls = 3
max_download_bytes = 2000000
max_text_chars = 120000
cache_ttl_seconds = 21600
# 已注入 AI 队列的全文路径保护期；服务端强制不低于 Kairos 900 秒队列窗口。
lease_seconds = 21600
max_cache_entries = 768
max_cache_bytes = 256000000

# 小红书 cookie/API 抓取器与 Windows Playwright 节点都是显式可选的 JSON
# adapter，均接收 POST {"url":"..."}。未配置或离线时聊天会安全降级，不受影响。
# xhs_api_url = "https://your-trusted-xhs-adapter.example/preview"
# xhs_api_token_env = "CC_LINK_PREVIEW_XHS_TOKEN"
# windows_api_url = "https://your-optional-windows-node.example/preview"

[auth]
# Android 首次登录接口 POST /login 使用。
# 不要把真实用户名、密码、GitHub token commit 到仓库；真实值只写本机 config.toml。
username = ""
password = ""

# 返回给 Android 后保存到本地，用于访问私有仓库 Release 检查更新。
ghp_token = ""

# 返回给 Android 的外网 VPS 地址。真实部署可改成当前 HTTPS 域名。
server_url = "https://companion-vps2.xiaonancaleb.xyz"

[xhs_login]
# Android 专用 WebView 登录能力；nonce 最长十分钟且只可使用一次。
ttl_seconds = 300
allowed_contacts = ["kairos"]
# 固定 argv，cookie JSON 只经 subprocess stdin 传入，不得改成 shell 字符串。
import_command = ["ssh", "memory-sg", "/home/ubuntu/xhs-login-bridge/import_cookies.py"]
